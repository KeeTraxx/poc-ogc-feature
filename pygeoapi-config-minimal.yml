server:
  bind:
    host: 0.0.0.0
    port: 5000
  url: /
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  language: en-US
  languages:
    - en-US
    - de-CH
    - fr-CH
    - it-CH
  cors: true
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'
  pretty_print: true
  limits:
    default_items: 10
    max_items: 100

logging:
  level: DEBUG

metadata:
  identification:
    title: Swiss Geospatial Data - minimal PoC
    description: Minimal OGC API Records PoC
    keywords:
      - geospatial
      - ogc
      - switzerland
    terms_of_service: https://creativecommons.org/licenses/by/4.0/
    url: https://www.swisstopo.admin.ch
  license:
    name: CC-BY 4.0 license
    url: https://creativecommons.org/licenses/by/4.0/
  provider:
    name: swisstopo PoC
    url: https://www.swisstopo.admin.ch
  contact:
    name: swisstopo
    role: pointOfContact

resources:
  swissgeo-catalogue-os:
    type: collection
    title: SwissGeo Catalogue (OpenSearch)
    description: Swiss geodata catalogue backed by OpenSearch
    keywords: [switzerland, geodata, catalogue, swisstopo, opensearch]
    links:
      - type: text/html
        rel: canonical
        title: swisstopo
        href: https://www.swisstopo.admin.ch
        hreflang: en-US
    extents:
      spatial:
        bbox: [5.9, 45.8, 10.5, 47.9]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: record
        name: swissgeo_provider.SwissGeoProvider
        data: ${OS_URL:-http://localhost:9200}/swissgeo-catalog
        id_field: externalId
        time_field: recordCreated
        title_field: title
        languages:
          - en-US
          - de-CH
          - fr-CH
          - it-CH

  sample-records:
    type: collection
    title: Sample Records
    description: Sample records for testing (see sample-records directory)
    keywords: [sample, records, testing]
    links: []
    extents:
      spatial:
        bbox: [5.9, 45.8, 10.5, 47.9]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: record
        name: swissgeo_provider.SwissGeoProvider
        data: ${OS_URL:-http://localhost:9200}/sample-records
        id_field: externalId
        time_field: recordCreated
        title_field: title
        languages:
          - en-US
          - de-CH
          - fr-CH
          - it-CH
